name: Production data maintenance

on:
  workflow_dispatch:
    inputs:
      apply_country_audit:
        description: Hide invalid facilities and re-moderate legacy submissions
        required: true
        type: boolean
        default: false
      import_batch17:
        description: Import the reviewed Batch 17 survey experiences
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read

concurrency:
  group: production-data-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Audit facilities and import reviewed data
    runs-on: ubuntu-latest
    env:
      # Long-running maintenance and migrations use Neon's direct connection.
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Require the production database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DIRECT_URL repository secret is not configured."
            exit 1
          fi

      - name: Require this commit to be live on Vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&environment=Production&per_page=1" \
            --jq '.[0].id // empty')"
          if [ -z "$deployment_id" ]; then
            echo "::error::No Vercel production deployment exists for ${GITHUB_SHA}."
            exit 1
          fi

          deployment_state="$(gh api \
            "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1" \
            --jq '.[0].state // empty')"
          if [ "$deployment_state" != "success" ]; then
            echo "::error::The matching Vercel deployment is '${deployment_state:-unknown}', not successful."
            exit 1
          fi

      - name: Apply pending schema migrations
        run: npx prisma migrate deploy

      - name: Preview the Saudi boundary audit
        run: npm run audit:saudi-facilities

      - name: Apply the Saudi boundary audit
        if: ${{ inputs.apply_country_audit }}
        run: npm run audit:saudi-facilities -- --apply

      - name: Validate the Batch 17 import
        run: npm run import:batch17

      - name: Import the Batch 17 experiences
        if: ${{ inputs.import_batch17 }}
        run: npm run import:batch17 -- --apply
