# Local development database for Tellyrate.
# Usage: npm run db:up   (start)   |   npm run db:down   (stop)
services:
  db:
    image: postgres:17-alpine
    container_name: tellyrate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tellyrate
      POSTGRES_PASSWORD: tellyrate
      POSTGRES_DB: tellyrate
    ports:
      - "5433:5432"
    volumes:
      - tellyrate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tellyrate -d tellyrate"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tellyrate-pgdata:
